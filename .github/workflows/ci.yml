name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # The bot host runs 3.12 (AL2023's python3.12 package). Testing on anything
          # else tests something nobody deploys.
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Test
        run: pytest -q

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Shellcheck the installer
        # It runs as root on the only host that can reach the game server. Worth linting.
        run: shellcheck deploy/install.sh

  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # Must match the host: pip-compile resolves for the interpreter it runs on, so
          # compiling under a different minor can pin a different dependency set.
          python-version: "3.12"

      # install.sh runs `pip install --require-hashes`, which fails closed if any package
      # in the file lacks a hash -- so a requirements.in edit that nobody recompiled shows
      # up as a broken DEPLOY, on the box with no SSH, rather than as a failed CI run.
      # This is that failed CI run.
      - name: requirements.txt is in sync with requirements.in
        run: |
          pip install --quiet pip-tools
          cp requirements.txt requirements.txt.committed
          pip-compile --generate-hashes --strip-extras --quiet \
            --output-file=requirements.txt requirements.in
          if ! diff -u requirements.txt.committed requirements.txt; then
            echo "::error::requirements.txt is stale. Regenerate it:"
            echo "  pip-compile --generate-hashes --strip-extras --output-file=requirements.txt requirements.in"
            exit 1
          fi
          echo "lockfile is current"
