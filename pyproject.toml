[project]
name = "pzbot"
version = "1.0.0"
description = "Discord control plane for the Project Zomboid server provisioned by ../pzserver"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

dependencies = [
  # Gateway client. The bot host is always on precisely so this WebSocket can be, which
  # is what lets /pz start work while the game server is powered off (DESIGN G3), and
  # what removes the 3-second interaction deadline from every long operation.
  "discord.py>=2.4,<3",
  "boto3>=1.34",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
pzbot = "pzbot.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# ASYNC109 wants `asyncio.timeout` instead of a `timeout=` parameter. The RCON client
# takes one on purpose: it is the same interface as `pz-rcon` on the game server, and
# every caller passes a different one depending on whether the world is loading.
"src/pzbot/aws.py" = ["ASYNC109"]
"src/pzbot/rcon.py" = ["ASYNC109"]
"src/pzbot/server.py" = ["ASYNC109"]
"tests/*" = ["ASYNC109"]
